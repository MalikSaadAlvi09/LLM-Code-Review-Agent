<svg width="1200" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="qtitle qdesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="qtitle">Quickstart pipeline banner</title>
  <desc id="qdesc">Four glowing steps: install, configure, run, report, connected by animated flowing lines.</desc>
  <defs>
    <linearGradient id="qbg" x1="20" y1="0" x2="1180" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030712"/>
      <stop offset="0.5" stop-color="#0A1230"/>
      <stop offset="1" stop-color="#130A2A"/>
    </linearGradient>
    <linearGradient id="qneon" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#23D5FF"/>
      <stop offset="0.35" stop-color="#7C5CFF"/>
      <stop offset="0.7" stop-color="#C15CFF"/>
      <stop offset="1" stop-color="#FF4FD8"/>
    </linearGradient>
    <filter id="qglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="220" rx="24" fill="url(#qbg)"/>
  <rect x="60" y="104" width="1080" height="3" rx="1.5" fill="url(#qneon)" opacity="0.55" filter="url(#qglow)"/>
  <rect x="60" y="104" width="1080" height="3" rx="1.5" fill="#ffffff" opacity="0.35">
    <animate attributeName="x" values="60;1030" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="width" values="90;90" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Step 1 -->
  <g transform="translate(150 106)">
    <circle r="42" fill="#080E20" stroke="#23D5FF" stroke-width="2.4" filter="url(#qglow)"/>
    <text text-anchor="middle" y="6" fill="#23D5FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">01</text>
    <text text-anchor="middle" y="72" fill="#F4F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1">INSTALL</text>
    <text text-anchor="middle" y="90" fill="#7FC4FF" font-family="monospace" font-size="10">pip install -e ".[dev]"</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(450 106)">
    <circle r="42" fill="#080E20" stroke="#7C5CFF" stroke-width="2.4" filter="url(#qglow)"/>
    <text text-anchor="middle" y="6" fill="#B2A3FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">02</text>
    <text text-anchor="middle" y="72" fill="#F4F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1">CONFIGURE</text>
    <text text-anchor="middle" y="90" fill="#B2A3FF" font-family="monospace" font-size="10">export OPENROUTER_API_KEY</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(750 106)">
    <circle r="42" fill="#080E20" stroke="#C15CFF" stroke-width="2.4" filter="url(#qglow)"/>
    <text text-anchor="middle" y="6" fill="#E1A3FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">03</text>
    <text text-anchor="middle" y="72" fill="#F4F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1">RUN</text>
    <text text-anchor="middle" y="90" fill="#E1A3FF" font-family="monospace" font-size="10">reviewagent review &lt;url&gt;</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(1050 106)">
    <circle r="42" fill="#080E20" stroke="#FF4FD8" stroke-width="2.4" filter="url(#qglow)"/>
    <text text-anchor="middle" y="6" fill="#FF8CDF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">04</text>
    <text text-anchor="middle" y="72" fill="#F4F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1">REPORT</text>
    <text text-anchor="middle" y="90" fill="#FF8CDF" font-family="monospace" font-size="10">code_review_report.md</text>
  </g>
</svg>
