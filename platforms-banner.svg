<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ptitle pdesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ptitle">Cross-platform setup banner</title>
  <desc id="pdesc">Three glowing terminal cards representing Windows, macOS, and Linux setup paths converging into the code-review-agent core.</desc>
  <defs>
    <linearGradient id="pbg" x1="30" y1="10" x2="1170" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030712"/>
      <stop offset="0.5" stop-color="#0A1230"/>
      <stop offset="1" stop-color="#130A2A"/>
    </linearGradient>
    <linearGradient id="pneon" x1="300" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#23D5FF"/>
      <stop offset="0.52" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#FF4FD8"/>
    </linearGradient>
    <pattern id="pgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#89B4FF" stroke-opacity="0.06"/>
    </pattern>
    <filter id="pglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#pbg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#pgrid)"/>

  <text x="600" y="46" text-anchor="middle" fill="#8EA4D2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="5">ONE AGENT · EVERY OPERATING SYSTEM</text>
  <text x="600" y="80" text-anchor="middle" fill="#F4F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800" letter-spacing="0.5">CROSS-PLATFORM SETUP</text>

  <!-- Windows card -->
  <g>
    <rect x="60" y="120" width="300" height="188" rx="16" fill="#080E20" stroke="#2FA6FF" stroke-opacity="0.75" stroke-width="1.6"/>
    <rect x="86" y="146" width="26" height="26" fill="#2FA6FF" opacity="0.9"/>
    <rect x="116" y="146" width="26" height="26" fill="#2FA6FF" opacity="0.55"/>
    <rect x="86" y="176" width="26" height="26" fill="#2FA6FF" opacity="0.55"/>
    <rect x="116" y="176" width="26" height="26" fill="#2FA6FF" opacity="0.9"/>
    <text x="160" y="167" fill="#F4F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">Windows</text>
    <text x="160" y="187" fill="#7FC4FF" font-family="monospace" font-size="11">PowerShell · CMD</text>
    <line x1="86" y1="204" x2="334" y2="204" stroke="#1E3A63" stroke-width="1"/>
    <text x="86" y="228" fill="#8FA6D6" font-family="monospace" font-size="11">winget install Python.Python.3.11</text>
    <text x="86" y="248" fill="#8FA6D6" font-family="monospace" font-size="11">winget install Git.Git</text>
    <text x="86" y="268" fill="#8FA6D6" font-family="monospace" font-size="11">.venv\Scripts\activate</text>
    <text x="86" y="292" fill="#5D7CB0" font-family="monospace" font-size="10">✓ execution-policy safe</text>
  </g>

  <!-- macOS card -->
  <g>
    <rect x="450" y="120" width="300" height="188" rx="16" fill="#080E20" stroke="#B9C2FF" stroke-opacity="0.75" stroke-width="1.6"/>
    <circle cx="500" cy="159" r="15" fill="none" stroke="#D8DEFF" stroke-width="2.4"/>
    <path d="M494 159a6 6 0 0 1 12 0" stroke="#D8DEFF" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <text x="550" y="167" fill="#F4F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">macOS</text>
    <text x="550" y="187" fill="#C7CCFF" font-family="monospace" font-size="11">zsh · bash</text>
    <line x1="476" y1="204" x2="724" y2="204" stroke="#2A2C63" stroke-width="1"/>
    <text x="476" y="228" fill="#A6ABE8" font-family="monospace" font-size="11">brew install python@3.11 git</text>
    <text x="476" y="248" fill="#A6ABE8" font-family="monospace" font-size="11">python3 -m venv .venv</text>
    <text x="476" y="268" fill="#A6ABE8" font-family="monospace" font-size="11">source .venv/bin/activate</text>
    <text x="476" y="292" fill="#6D71AE" font-family="monospace" font-size="10">✓ Apple Silicon &amp; Intel</text>
  </g>

  <!-- Linux card -->
  <g>
    <rect x="840" y="120" width="300" height="188" rx="16" fill="#080E20" stroke="#FFC857" stroke-opacity="0.8" stroke-width="1.6"/>
    <circle cx="890" cy="159" r="14" fill="#1A1506" stroke="#FFC857" stroke-width="2.2"/>
    <circle cx="884" cy="155" r="2" fill="#FFC857"/><circle cx="896" cy="155" r="2" fill="#FFC857"/>
    <path d="M882 165q8 6 16 0" stroke="#FFC857" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="940" y="167" fill="#F4F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">Linux</text>
    <text x="940" y="187" fill="#FFD982" font-family="monospace" font-size="11">bash · zsh</text>
    <line x1="866" y1="204" x2="1114" y2="204" stroke="#3A2E10" stroke-width="1"/>
    <text x="866" y="228" fill="#D8C08A" font-family="monospace" font-size="11">sudo apt install python3-venv git</text>
    <text x="866" y="248" fill="#D8C08A" font-family="monospace" font-size="11">python3 -m venv .venv</text>
    <text x="866" y="268" fill="#D8C08A" font-family="monospace" font-size="11">source .venv/bin/activate</text>
    <text x="866" y="292" fill="#8A7A46" font-family="monospace" font-size="10">✓ Debian · Fedora · Arch</text>
  </g>

  <!-- connectors into center -->
  <path d="M210 308 C210 340 600 340 600 316" stroke="#2FA6FF" stroke-width="1.6" stroke-dasharray="5 8" opacity="0.6" filter="url(#pglow)">
    <animate attributeName="stroke-dashoffset" values="26;0" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <path d="M990 308 C990 340 600 340 600 316" stroke="#FFC857" stroke-width="1.6" stroke-dasharray="5 8" opacity="0.6" filter="url(#pglow)">
    <animate attributeName="stroke-dashoffset" values="26;0" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <path d="M600 308 L600 316" stroke="#B9C2FF" stroke-width="1.6" opacity="0.6"/>

  <g transform="translate(600 332)">
    <rect x="-118" y="-14" width="236" height="28" rx="14" fill="#0C1024" stroke="url(#pneon)" stroke-width="1.6" filter="url(#pglow)"/>
    <text text-anchor="middle" y="5" fill="#EAF0FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">reviewagent review &lt;repo&gt;</text>
  </g>
</svg>
