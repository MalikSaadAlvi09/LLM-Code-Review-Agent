<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Code Review Agent cinematic banner</title>
  <desc id="desc">Animated neon interface showing source code flowing through an AI review core into verified findings.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="1160" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030712"/>
      <stop offset="0.48" stop-color="#0A1230"/>
      <stop offset="1" stop-color="#130A2A"/>
    </linearGradient>
    <linearGradient id="neon" x1="300" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#23D5FF"/>
      <stop offset="0.52" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#FF4FD8"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(600 266) rotate(90) scale(142)">
      <stop stop-color="#765BFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#765BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#89B4FF" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <clipPath id="terminalClip"><rect x="66" y="152" width="298" height="230" rx="10"/></clipPath>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="28" fill="url(#grid)"/>
  <ellipse cx="600" cy="266" rx="330" ry="190" fill="url(#core)"/>
  <circle cx="1040" cy="85" r="110" fill="#7C5CFF" fill-opacity="0.10" filter="url(#soft)"/>
  <circle cx="115" cy="440" r="125" fill="#20CFFF" fill-opacity="0.08" filter="url(#soft)"/>

  <g opacity="0.8">
    <circle cx="96" cy="90" r="2" fill="#70E9FF"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="400" r="2.5" fill="#FF72E1"><animate attributeName="opacity" values="1;0.15;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1004" cy="150" r="1.5" fill="#FFFFFF"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="120" r="1.5" fill="#FFFFFF"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.7s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="62" text-anchor="middle" fill="#8EA4D2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="5">AUTONOMOUS REPOSITORY INTELLIGENCE</text>
  <text x="600" y="112" text-anchor="middle" fill="#F4F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="800" letter-spacing="1">CODE REVIEW AGENT</text>
  <rect x="390" y="130" width="420" height="3" rx="2" fill="url(#neon)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3s" repeatCount="indefinite"/>
  </rect>

  <g>
    <rect x="54" y="145" width="324" height="252" rx="16" fill="#080E20" stroke="#25345D" stroke-width="1.5"/>
    <circle cx="77" cy="168" r="5" fill="#FF5E75"/><circle cx="95" cy="168" r="5" fill="#FFC857"/><circle cx="113" cy="168" r="5" fill="#38D996"/>
    <text x="344" y="172" text-anchor="end" fill="#6679A8" font-family="monospace" font-size="11">repository.py</text>
    <g clip-path="url(#terminalClip)" font-family="JetBrains Mono,Consolas,monospace" font-size="12">
      <text x="76" y="208" fill="#61739D">01</text><text x="106" y="208" fill="#CC78FA">def</text><text x="132" y="208" fill="#73D9FF"> review</text><text x="181" y="208" fill="#D8E2FF">(repo):</text>
      <text x="76" y="234" fill="#61739D">02</text><text x="118" y="234" fill="#D8E2FF">files = discover(repo)</text>
      <text x="76" y="260" fill="#61739D">03</text><text x="118" y="260" fill="#CC78FA">for</text><text x="144" y="260" fill="#D8E2FF"> file </text><text x="184" y="260" fill="#CC78FA">in</text><text x="202" y="260" fill="#D8E2FF"> files:</text>
      <text x="76" y="286" fill="#61739D">04</text><text x="130" y="286" fill="#D8E2FF">chunks = split(file)</text>
      <text x="76" y="312" fill="#61739D">05</text><text x="130" y="312" fill="#D8E2FF">findings += ai(chunks)</text>
      <text x="76" y="338" fill="#61739D">06</text><text x="118" y="338" fill="#CC78FA">return</text><text x="164" y="338" fill="#73D9FF"> prioritize</text><text x="236" y="338" fill="#D8E2FF">(findings)</text>
      <rect x="70" y="190" width="300" height="158" fill="url(#bg)" opacity="0.95">
        <animate attributeName="y" values="190;355" dur="3.2s" fill="freeze"/>
        <animate attributeName="height" values="158;0" dur="3.2s" fill="freeze"/>
      </rect>
    </g>
  </g>

  <g>
    <path d="M390 270H487" stroke="#25D5FF" stroke-width="2" stroke-dasharray="7 9" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="32;0" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M713 270H810" stroke="#BF68FF" stroke-width="2" stroke-dasharray="7 9" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="32;0" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(600 270)">
    <circle r="104" fill="#09122B" stroke="url(#neon)" stroke-width="2.5" filter="url(#glow)"/>
    <circle r="85" stroke="#7F8DFF" stroke-opacity="0.32" stroke-dasharray="5 12">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="63" stroke="#48DFFF" stroke-opacity="0.42" stroke-dasharray="2 9">
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <path d="M-24-8L0-22L24-8V20L0 34L-24 20V-8Z" fill="#101E43" stroke="#70E7FF" stroke-width="2"/>
    <path d="M-10 3L-2 11L13-6" stroke="#83FFD0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text y="62" text-anchor="middle" fill="#AEBEFE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">AI REVIEW CORE</text>
  </g>

  <g>
    <rect x="822" y="145" width="324" height="252" rx="16" fill="#080E20" stroke="#3B2B68" stroke-width="1.5"/>
    <text x="848" y="176" fill="#F0F4FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">REVIEW SIGNAL</text>
    <rect x="848" y="198" width="272" height="46" rx="8" fill="#251127" stroke="#FF667F" stroke-opacity="0.6"/>
    <circle cx="871" cy="221" r="7" fill="#FF5E75"><animate attributeName="opacity" values="0.45;1;0.45" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="890" y="218" fill="#FF90A1" font-family="monospace" font-size="11" font-weight="700">CRITICAL</text>
    <text x="890" y="233" fill="#AEB9D6" font-family="monospace" font-size="10">shell injection · line 84</text>
    <rect x="848" y="258" width="272" height="46" rx="8" fill="#221D12" stroke="#FFC857" stroke-opacity="0.55"/>
    <circle cx="871" cy="281" r="7" fill="#FFC857"/>
    <text x="890" y="278" fill="#FFD982" font-family="monospace" font-size="11" font-weight="700">MEDIUM</text>
    <text x="890" y="293" fill="#AEB9D6" font-family="monospace" font-size="10">resource cleanup · line 180</text>
    <rect x="848" y="318" width="272" height="46" rx="8" fill="#10251F" stroke="#3AE6A0" stroke-opacity="0.5"/>
    <circle cx="871" cy="341" r="7" fill="#3AE6A0"/>
    <text x="890" y="338" fill="#72F2BD" font-family="monospace" font-size="11" font-weight="700">VERIFIED</text>
    <text x="890" y="353" fill="#AEB9D6" font-family="monospace" font-size="10">line-safe reconstruction</text>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">
    <rect x="256" y="432" width="180" height="38" rx="19" fill="#0C1931" stroke="#264B75"/><text x="346" y="456" text-anchor="middle" fill="#78DFFF">LINE-SAFE CHUNKS</text>
    <rect x="510" y="432" width="180" height="38" rx="19" fill="#151334" stroke="#5849A0"/><text x="600" y="456" text-anchor="middle" fill="#B2A3FF">MULTI-PROVIDER</text>
    <rect x="764" y="432" width="180" height="38" rx="19" fill="#241029" stroke="#7E386F"/><text x="854" y="456" text-anchor="middle" fill="#FF8CDF">GROUNDED FOLLOW-UP</text>
  </g>
</svg>
