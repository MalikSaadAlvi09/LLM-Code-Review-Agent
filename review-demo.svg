<svg width="1100" height="390" viewBox="0 0 1100 390" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated Code Review Agent terminal demonstration</title>
  <desc id="desc">A terminal progressively showing repository discovery, AI review, deduplication, and report generation.</desc>
  <defs>
    <linearGradient id="frame" x1="70" y1="20" x2="1030" y2="370" gradientUnits="userSpaceOnUse"><stop stop-color="#22D3EE"/><stop offset="0.5" stop-color="#705BFF"/><stop offset="1" stop-color="#EC4899"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6EE7FF" stop-opacity="0"/><stop offset="0.5" stop-color="#6EE7FF" stop-opacity="0.15"/><stop offset="1" stop-color="#6EE7FF" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="screen"><rect x="46" y="76" width="1008" height="266" rx="4"/></clipPath>
  </defs>
  <rect width="1100" height="390" rx="24" fill="#030711"/>
  <rect x="20" y="20" width="1060" height="350" rx="17" fill="#060C19" stroke="url(#frame)" stroke-width="2"/>
  <rect x="20" y="20" width="1060" height="48" rx="17" fill="#0B1325"/>
  <path d="M20 52V68H1080V52" fill="#0B1325"/>
  <circle cx="48" cy="44" r="6" fill="#FF5F57"/><circle cx="69" cy="44" r="6" fill="#FEBC2E"/><circle cx="90" cy="44" r="6" fill="#28C840"/>
  <text x="550" y="49" text-anchor="middle" fill="#8191B5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="2">REVIEWAGENT // SECURE TERMINAL</text>
  <g clip-path="url(#screen)" font-family="JetBrains Mono,Consolas,monospace" font-size="16">
    <text x="48" y="106" fill="#72F2BD">❯</text><text x="72" y="106" fill="#E6EDFF"> reviewagent review github.com/acme/api</text>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.12;1" dur="8s" repeatCount="indefinite"/>
      <text x="48" y="142" fill="#64749A">[01:12:04]</text><text x="150" y="142" fill="#78DFFF"> CLONE</text><text x="225" y="142" fill="#C9D4F2"> Shallow clone complete</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.28;1" dur="8s" repeatCount="indefinite"/>
      <text x="48" y="176" fill="#64749A">[01:12:05]</text><text x="150" y="176" fill="#A99BFF"> DISCOVER</text><text x="258" y="176" fill="#C9D4F2"> 42 Python files · 18,904 lines</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.44;1" dur="8s" repeatCount="indefinite"/>
      <text x="48" y="210" fill="#64749A">[01:12:06]</text><text x="150" y="210" fill="#FF8CDF"> REVIEW</text><text x="239" y="210" fill="#C9D4F2"> Analyzing line-safe windows</text><text x="528" y="210" fill="#7C8BAD">········</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.63;1" dur="8s" repeatCount="indefinite"/>
      <text x="48" y="244" fill="#64749A">[01:12:42]</text><text x="150" y="244" fill="#FFD982"> MERGE</text><text x="226" y="244" fill="#C9D4F2"> 31 findings · 5 duplicates removed</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.79;1" dur="8s" repeatCount="indefinite"/>
      <text x="48" y="278" fill="#64749A">[01:12:43]</text><text x="150" y="278" fill="#FF738A"> SIGNAL</text><text x="239" y="278" fill="#FF738A"> 1 critical</text><text x="350" y="278" fill="#FFD982"> 3 high</text><text x="430" y="278" fill="#C9D4F2"> 8 medium · 14 low</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.94;1" dur="8s" repeatCount="indefinite"/>
      <text x="48" y="312" fill="#64749A">[01:12:43]</text><text x="150" y="312" fill="#72F2BD"> ✓ REPORT</text><text x="252" y="312" fill="#E6EDFF"> code_review_report.md</text><rect x="454" y="297" width="9" height="19" fill="#72F2BD"><animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></rect>
    </g>
    <rect x="30" y="70" width="1040" height="45" fill="url(#scan)"><animate attributeName="y" values="70;335;70" dur="5.5s" repeatCount="indefinite"/></rect>
  </g>
</svg>
